<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 740" role="img" aria-label="Иллюстрация ухоженных рук с нюдовым маникюром">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9e4"/><stop offset=".55" stop-color="#f6d9d4"/><stop offset="1" stop-color="#ecd2d8"/></linearGradient>
<linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9c2"/><stop offset="1" stop-color="#eec3a6"/></linearGradient>
<linearGradient id="nail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf1ec"/><stop offset="1" stop-color="#f2c9c2"/></linearGradient>
<linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b95f6b"/><stop offset="1" stop-color="#8e3f4b"/></linearGradient>
</defs>
<rect width="640" height="740" rx="24" fill="url(#bg)"/>
<circle cx="110" cy="120" r="70" fill="#ffffff" opacity=".45"/>
<circle cx="540" cy="640" r="90" fill="#ffffff" opacity=".35"/>
<circle cx="530" cy="110" r="26" fill="none" stroke="#b95f6b" stroke-width="2" opacity=".4"/>
<circle cx="530" cy="110" r="44" fill="none" stroke="#b95f6b" stroke-width="1.5" opacity=".25"/>
<!-- рука -->
<g>
<rect x="150" y="330" width="330" height="150" rx="75" fill="url(#skin)"/>
<!-- пальцы -->
<g fill="url(#skin)">
<rect x="160" y="250" width="62" height="170" rx="31"/>
<rect x="232" y="225" width="62" height="195" rx="31"/>
<rect x="304" y="220" width="62" height="200" rx="31"/>
<rect x="376" y="245" width="62" height="175" rx="31"/>
</g>
<!-- ногти -->
<g fill="url(#nail)" stroke="#d99aa2" stroke-width="2">
<rect x="168" y="236" width="46" height="64" rx="20"/>
<rect x="240" y="210" width="46" height="66" rx="20"/>
<rect x="312" y="205" width="46" height="66" rx="20"/>
<rect x="384" y="231" width="46" height="64" rx="20"/>
</g>
<!-- лунки и блики -->
<g fill="#ffffff" opacity=".8">
<ellipse cx="263" cy="228" rx="8" ry="12"/>
<ellipse cx="335" cy="223" rx="8" ry="12"/>
</g>
<!-- френч-улыбки -->
<g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9">
<path d="M170 252 q21 -10 42 0"/>
<path d="M242 226 q21 -10 42 0"/>
<path d="M314 221 q21 -10 42 0"/>
<path d="M386 247 q21 -10 42 0"/>
</g>
</g>
<!-- флакон лака -->
<g transform="translate(430,470)">
<rect x="0" y="60" width="110" height="130" rx="18" fill="url(#bottle)"/>
<rect x="0" y="60" width="110" height="130" rx="18" fill="#ffffff" opacity=".12"/>
<rect x="35" y="20" width="40" height="48" rx="8" fill="#3a2e28"/>
<rect x="30" y="0" width="50" height="26" rx="8" fill="#c9a26b"/>
<ellipse cx="38" cy="110" rx="12" ry="26" fill="#ffffff" opacity=".35"/>
<text x="55" y="140" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="26" fill="#fff">N</text>
</g>
<!-- цветы -->
<g opacity=".9">
<circle cx="140" cy="560" r="16" fill="#fff"/><circle cx="140" cy="560" r="6" fill="#e8b4b8"/>
<circle cx="180" cy="600" r="12" fill="#f6dfe1" stroke="#d98a94" stroke-width="2"/><circle cx="180" cy="600" r="4" fill="#b95f6b"/>
<circle cx="110" cy="610" r="10" fill="#fff" stroke="#d98a94" stroke-width="2"/>
<path d="M140 576 q4 30 -8 52" stroke="#9a8a7e" stroke-width="2" fill="none"/>
</g>
<text x="320" y="700" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#7a4a52">нежный нюд · френч · забота</text>
</svg>
